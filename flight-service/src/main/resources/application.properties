quarkus.application.name=flight-service
quarkus.http.port=8083
quarkus.grpc.server.port=9003
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${FLIGHT_DB_USER:flight}
quarkus.datasource.password=${FLIGHT_DB_PASSWORD:flight}
quarkus.datasource.jdbc.url=${FLIGHT_JDBC_URL:jdbc:postgresql://localhost:5432/flight}
quarkus.datasource.reactive.url=${FLIGHT_REACTIVE_URL:postgresql://localhost:5432/flight}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.outgoing.outbox.connector=smallrye-kafka
mp.messaging.outgoing.outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.merge=true
mp.messaging.incoming.reserve-flight.topic=trip.flight.reserve-requested.v1
mp.messaging.incoming.reserve-flight.failure-strategy=dead-letter-queue
mp.messaging.incoming.reserve-flight.dead-letter-queue.topic=trip.flight.reserve-requested.v1.dlq
mp.messaging.incoming.confirm-flight.topic=trip.flight.confirm-requested.v1
mp.messaging.incoming.confirm-flight.failure-strategy=dead-letter-queue
mp.messaging.incoming.confirm-flight.dead-letter-queue.topic=trip.flight.confirm-requested.v1.dlq
mp.messaging.incoming.cancel-flight.topic=trip.flight.cancel-requested.v1
mp.messaging.incoming.cancel-flight.failure-strategy=dead-letter-queue
mp.messaging.incoming.cancel-flight.dead-letter-queue.topic=trip.flight.cancel-requested.v1.dlq
mp.messaging.connector.smallrye-kafka.group.id=flight-commands-v1
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.json.enabled=${JSON_LOGS:false}
