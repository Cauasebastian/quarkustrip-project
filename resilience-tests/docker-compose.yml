name: trip-resilience

services:
  postgres:
    image: postgres:16.8-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: trip
      POSTGRES_PASSWORD: trip
      POSTGRES_DB: resilience
    ports: ["35432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip -d resilience"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongodb:
    image: mongo:7.0.17
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 384m
    ports: ["37017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 4s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    mem_limit: 640m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CHAOS:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,CHAOS://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,CHAOS://localhost:38663
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms192m -Xmx384m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 3s
      start_period: 15s
      timeout: 5s
      retries: 30

  dependency-stub:
    image: wiremock/wiremock:3.13.1
    mem_limit: 192m
    ports: ["38089:8080"]
    volumes:
      - ./wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    mem_limit: 96m
    ports:
      - "38474:8474"
      - "38663:8663"
      - "38666:8666"
      - "38667:8667"
    depends_on:
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      dependency-stub: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 3s
      retries: 30
