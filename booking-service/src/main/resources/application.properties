quarkus.application.name=booking-service
quarkus.http.port=8082
quarkus.grpc.server.port=9002

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${BOOKING_DB_USER:booking}
quarkus.datasource.password=${BOOKING_DB_PASSWORD:booking}
quarkus.datasource.jdbc.url=${BOOKING_JDBC_URL:jdbc:postgresql://localhost:5432/booking}
quarkus.datasource.reactive.url=${BOOKING_REACTIVE_URL:postgresql://localhost:5432/booking}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.outgoing.outbox.connector=smallrye-kafka
mp.messaging.outgoing.outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.merge=true

mp.messaging.incoming.flight-held.topic=trip.flight.held.v1
mp.messaging.incoming.flight-held.failure-strategy=dead-letter-queue
mp.messaging.incoming.flight-held.dead-letter-queue.topic=trip.flight.held.v1.dlq
mp.messaging.incoming.flight-failed.topic=trip.flight.failed.v1
mp.messaging.incoming.flight-failed.failure-strategy=dead-letter-queue
mp.messaging.incoming.flight-failed.dead-letter-queue.topic=trip.flight.failed.v1.dlq
mp.messaging.incoming.flight-confirmed.topic=trip.flight.confirmed.v1
mp.messaging.incoming.flight-confirmed.failure-strategy=dead-letter-queue
mp.messaging.incoming.flight-confirmed.dead-letter-queue.topic=trip.flight.confirmed.v1.dlq
mp.messaging.incoming.flight-cancelled.topic=trip.flight.cancelled.v1
mp.messaging.incoming.flight-cancelled.failure-strategy=dead-letter-queue
mp.messaging.incoming.flight-cancelled.dead-letter-queue.topic=trip.flight.cancelled.v1.dlq
mp.messaging.incoming.hotel-held.topic=trip.hotel.held.v1
mp.messaging.incoming.hotel-held.failure-strategy=dead-letter-queue
mp.messaging.incoming.hotel-held.dead-letter-queue.topic=trip.hotel.held.v1.dlq
mp.messaging.incoming.hotel-failed.topic=trip.hotel.failed.v1
mp.messaging.incoming.hotel-failed.failure-strategy=dead-letter-queue
mp.messaging.incoming.hotel-failed.dead-letter-queue.topic=trip.hotel.failed.v1.dlq
mp.messaging.incoming.hotel-confirmed.topic=trip.hotel.confirmed.v1
mp.messaging.incoming.hotel-confirmed.failure-strategy=dead-letter-queue
mp.messaging.incoming.hotel-confirmed.dead-letter-queue.topic=trip.hotel.confirmed.v1.dlq
mp.messaging.incoming.hotel-cancelled.topic=trip.hotel.cancelled.v1
mp.messaging.incoming.hotel-cancelled.failure-strategy=dead-letter-queue
mp.messaging.incoming.hotel-cancelled.dead-letter-queue.topic=trip.hotel.cancelled.v1.dlq
mp.messaging.incoming.transport-held.topic=trip.transport.held.v1
mp.messaging.incoming.transport-held.failure-strategy=dead-letter-queue
mp.messaging.incoming.transport-held.dead-letter-queue.topic=trip.transport.held.v1.dlq
mp.messaging.incoming.transport-failed.topic=trip.transport.failed.v1
mp.messaging.incoming.transport-failed.failure-strategy=dead-letter-queue
mp.messaging.incoming.transport-failed.dead-letter-queue.topic=trip.transport.failed.v1.dlq
mp.messaging.incoming.transport-confirmed.topic=trip.transport.confirmed.v1
mp.messaging.incoming.transport-confirmed.failure-strategy=dead-letter-queue
mp.messaging.incoming.transport-confirmed.dead-letter-queue.topic=trip.transport.confirmed.v1.dlq
mp.messaging.incoming.transport-cancelled.topic=trip.transport.cancelled.v1
mp.messaging.incoming.transport-cancelled.failure-strategy=dead-letter-queue
mp.messaging.incoming.transport-cancelled.dead-letter-queue.topic=trip.transport.cancelled.v1.dlq
mp.messaging.incoming.payment-succeeded.topic=trip.payment.succeeded.v1
mp.messaging.incoming.payment-succeeded.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-succeeded.dead-letter-queue.topic=trip.payment.succeeded.v1.dlq
mp.messaging.incoming.payment-failed.topic=trip.payment.failed.v1
mp.messaging.incoming.payment-failed.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-failed.dead-letter-queue.topic=trip.payment.failed.v1.dlq
mp.messaging.incoming.payment-refunded.topic=trip.payment.refunded.v1
mp.messaging.incoming.payment-refunded.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-refunded.dead-letter-queue.topic=trip.payment.refunded.v1.dlq
mp.messaging.incoming.payment-refund-failed.topic=trip.payment.refund-failed.v1
mp.messaging.incoming.payment-refund-failed.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-refund-failed.dead-letter-queue.topic=trip.payment.refund-failed.v1.dlq
mp.messaging.connector.smallrye-kafka.group.id=booking-saga-v1
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.commit-strategy=throttled

quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.json.enabled=${JSON_LOGS:false}
