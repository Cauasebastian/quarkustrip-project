x-otel-environment: &otel-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  QUARKUS_OTEL_SDK_DISABLED: "false"
  QUARKUS_OTEL_TRACES_SAMPLER: parentbased_always_on
  QUARKUS_OTEL_BSP_SCHEDULE_DELAY: 1s
  QUARKUS_OTEL_INSTRUMENT_VERTX_SQL_CLIENT: "false"

x-jaeger-dependency: &jaeger-dependency
  jaeger:
    condition: service_healthy

services:
  api-gateway-service:
    environment:
      <<: *otel-environment
      JAEGER_QUERY_URL: http://jaeger:16686
    depends_on: *jaeger-dependency

  booking-service:
    environment: *otel-environment
    depends_on: *jaeger-dependency

  flight-service:
    environment: *otel-environment
    depends_on: *jaeger-dependency

  hotel-service:
    environment: *otel-environment
    depends_on: *jaeger-dependency

  transport-service:
    environment: *otel-environment
    depends_on: *jaeger-dependency

  payment-service:
    environment: *otel-environment
    depends_on: *jaeger-dependency

  notification-service:
    environment: *otel-environment
    depends_on: *jaeger-dependency

  user-service:
    environment: *otel-environment
    depends_on: *jaeger-dependency
