quarkus.application.name=hotel-service
quarkus.http.port=8084
quarkus.grpc.server.port=9004
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${HOTEL_DB_USER:hotel}
quarkus.datasource.password=${HOTEL_DB_PASSWORD:hotel}
quarkus.datasource.jdbc.url=${HOTEL_JDBC_URL:jdbc:postgresql://localhost:5432/hotel}
quarkus.datasource.reactive.url=${HOTEL_REACTIVE_URL:postgresql://localhost:5432/hotel}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.outgoing.outbox.connector=smallrye-kafka
mp.messaging.outgoing.outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.merge=true
mp.messaging.outgoing.outbox.acks=all
mp.messaging.outgoing.outbox.enable.idempotence=true
mp.messaging.outgoing.outbox.max.in.flight.requests.per.connection=5

trip.outbox.notify-enabled=${OUTBOX_NOTIFY_ENABLED:true}
trip.outbox.notification-channel=trip_outbox
trip.outbox.publish-interval=${OUTBOX_PUBLISH_INTERVAL:500ms}
trip.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
trip.outbox.max-concurrency=${OUTBOX_MAX_CONCURRENCY:8}
mp.messaging.incoming.reserve-hotel.topic=trip.hotel.reserve-requested.v1
mp.messaging.incoming.reserve-hotel.failure-strategy=dead-letter-queue
mp.messaging.incoming.reserve-hotel.dead-letter-queue.topic=trip.hotel.reserve-requested.v1.dlq
mp.messaging.incoming.confirm-hotel.topic=trip.hotel.confirm-requested.v1
mp.messaging.incoming.confirm-hotel.failure-strategy=dead-letter-queue
mp.messaging.incoming.confirm-hotel.dead-letter-queue.topic=trip.hotel.confirm-requested.v1.dlq
mp.messaging.incoming.cancel-hotel.topic=trip.hotel.cancel-requested.v1
mp.messaging.incoming.cancel-hotel.failure-strategy=dead-letter-queue
mp.messaging.incoming.cancel-hotel.dead-letter-queue.topic=trip.hotel.cancel-requested.v1.dlq
mp.messaging.connector.smallrye-kafka.group.id=hotel-commands-v1
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.json.enabled=${JSON_LOGS:false}
