quarkus.application.name=payment-service
quarkus.http.port=8086
quarkus.grpc.server.port=9006
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PAYMENT_DB_USER:payment}
quarkus.datasource.password=${PAYMENT_DB_PASSWORD:payment}
quarkus.datasource.jdbc.url=${PAYMENT_JDBC_URL:jdbc:postgresql://localhost:5432/payment}
quarkus.datasource.reactive.url=${PAYMENT_REACTIVE_URL:postgresql://localhost:5432/payment}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.outbox.connector=smallrye-kafka
mp.messaging.outgoing.outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.merge=true
mp.messaging.incoming.process-payment.topic=trip.payment.process-requested.v1
mp.messaging.incoming.process-payment.dead-letter-queue.topic=trip.payment.process-requested.v1.dlq
mp.messaging.incoming.refund-payment.topic=trip.payment.refund-requested.v1
mp.messaging.incoming.refund-payment.dead-letter-queue.topic=trip.payment.refund-requested.v1.dlq
mp.messaging.connector.smallrye-kafka.group.id=payment-commands-v1
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.failure-strategy=dead-letter-queue
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.json.enabled=${JSON_LOGS:false}
