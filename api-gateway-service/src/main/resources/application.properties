quarkus.application.name=api-gateway-service
quarkus.http.port=8080
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/trip}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:trip-gateway}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.grpc.clients.booking.host=${BOOKING_GRPC_HOST:localhost}
quarkus.grpc.clients.booking.port=${BOOKING_GRPC_PORT:9002}
quarkus.grpc.clients.flight.host=${FLIGHT_GRPC_HOST:localhost}
quarkus.grpc.clients.flight.port=${FLIGHT_GRPC_PORT:9003}
quarkus.grpc.clients.hotel.host=${HOTEL_GRPC_HOST:localhost}
quarkus.grpc.clients.hotel.port=${HOTEL_GRPC_PORT:9004}
quarkus.grpc.clients.transport.host=${TRANSPORT_GRPC_HOST:localhost}
quarkus.grpc.clients.transport.port=${TRANSPORT_GRPC_PORT:9005}
quarkus.grpc.clients.user.host=${USER_GRPC_HOST:localhost}
quarkus.grpc.clients.user.port=${USER_GRPC_PORT:9007}
quarkus.grpc.clients.*.use-quarkus-grpc-client=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Idempotency-Key
quarkus.http.cors.exposed-headers=Location
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.smallrye-openapi.info-title=Trip API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.log.console.json.enabled=${JSON_LOGS:false}
