quarkus.application.name=notification-service
quarkus.http.port=8088
quarkus.grpc.server.port=9008
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:notifications}
quarkus.mongodb.uuid-representation=standard
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.incoming.user-profile-changed.topic=trip.user.profile-changed.v1
mp.messaging.incoming.user-profile-changed.failure-strategy=dead-letter-queue
mp.messaging.incoming.user-profile-changed.dead-letter-queue.topic=trip.user.profile-changed.v1.dlq
mp.messaging.incoming.booking-confirmed.topic=trip.booking.confirmed.v1
mp.messaging.incoming.booking-confirmed.failure-strategy=dead-letter-queue
mp.messaging.incoming.booking-confirmed.dead-letter-queue.topic=trip.booking.confirmed.v1.dlq
mp.messaging.incoming.booking-failed.topic=trip.booking.failed.v1
mp.messaging.incoming.booking-failed.failure-strategy=dead-letter-queue
mp.messaging.incoming.booking-failed.dead-letter-queue.topic=trip.booking.failed.v1.dlq
mp.messaging.incoming.booking-cancelled.topic=trip.booking.cancelled.v1
mp.messaging.incoming.booking-cancelled.failure-strategy=dead-letter-queue
mp.messaging.incoming.booking-cancelled.dead-letter-queue.topic=trip.booking.cancelled.v1.dlq
mp.messaging.incoming.booking-manual-review.topic=trip.booking.manual-review.v1
mp.messaging.incoming.booking-manual-review.failure-strategy=dead-letter-queue
mp.messaging.incoming.booking-manual-review.dead-letter-queue.topic=trip.booking.manual-review.v1.dlq
mp.messaging.outgoing.notification-events.connector=smallrye-kafka
mp.messaging.outgoing.notification-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.notification-events.merge=true
mp.messaging.connector.smallrye-kafka.group.id=notification-terminal-events-v1
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
quarkus.mailer.from=no-reply@trip.local
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.mock=false
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.json.enabled=${JSON_LOGS:false}
