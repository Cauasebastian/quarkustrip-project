quarkus.application.name=transport-service
quarkus.http.port=8085
quarkus.grpc.server.port=9005
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${TRANSPORT_DB_USER:transport}
quarkus.datasource.password=${TRANSPORT_DB_PASSWORD:transport}
quarkus.datasource.jdbc.url=${TRANSPORT_JDBC_URL:jdbc:postgresql://localhost:5432/transport}
quarkus.datasource.reactive.url=${TRANSPORT_REACTIVE_URL:postgresql://localhost:5432/transport}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.outgoing.outbox.connector=smallrye-kafka
mp.messaging.outgoing.outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.merge=true
mp.messaging.incoming.reserve-transport.topic=trip.transport.reserve-requested.v1
mp.messaging.incoming.reserve-transport.failure-strategy=dead-letter-queue
mp.messaging.incoming.reserve-transport.dead-letter-queue.topic=trip.transport.reserve-requested.v1.dlq
mp.messaging.incoming.confirm-transport.topic=trip.transport.confirm-requested.v1
mp.messaging.incoming.confirm-transport.failure-strategy=dead-letter-queue
mp.messaging.incoming.confirm-transport.dead-letter-queue.topic=trip.transport.confirm-requested.v1.dlq
mp.messaging.incoming.cancel-transport.topic=trip.transport.cancel-requested.v1
mp.messaging.incoming.cancel-transport.failure-strategy=dead-letter-queue
mp.messaging.incoming.cancel-transport.dead-letter-queue.topic=trip.transport.cancel-requested.v1.dlq
mp.messaging.connector.smallrye-kafka.group.id=transport-commands-v1
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.json.enabled=${JSON_LOGS:false}
