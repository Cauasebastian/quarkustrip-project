receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: trip_memory

extensions:
  jaeger_storage:
    backends:
      trip_memory:
        memory:
          max_traces: 10000
  jaeger_query:
    storage:
      traces: trip_memory
    ui:
      config_file: /etc/jaeger/ui-config.json
    grpc:
      endpoint: 0.0.0.0:16685
    http:
      endpoint: 0.0.0.0:16686
  healthcheckv2: {}

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
